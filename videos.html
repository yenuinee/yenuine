<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Videos — Yenuine</title>
<meta name="description" content="Videoclips, spots y contenido vertical producidos por Yenuine.">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   LISTA DE VIDEOS — solo edita esto para agregar o quitar videos
   platform: 'youtube' o 'vimeo'
   id:       YouTube -> lo que va después de watch?v=   (ej. dQw4w9WgXcQ)
             Vimeo   -> el número de la URL             (ej. 1186309435)
   vertical: true para videos 9:16
   title / client: si los dejas vacíos se llenan solos con el título y el
                   canal del video (puedes escribirlos para cambiarlos)
   category: opcional, cada categoría distinta se vuelve un filtro arriba
   ===================================================================== */
const VIDEOS = [
  { platform: 'youtube', id: 'O3RkS5pepDk', title: '', client: '', category: '', vertical: false },
  { platform: 'youtube', id: 'aQU6wWtliG4', title: '', client: '', category: '', vertical: false },
  { platform: 'youtube', id: 'ZNazTNiISpg', title: '', client: '', category: '', vertical: false },
  { platform: 'youtube', id: 'gGbYc63lVls', title: '', client: '', category: '', vertical: false },
  { platform: 'youtube', id: 'mg_bB6Gul6s', title: '', client: '', category: '', vertical: false },
  { platform: 'youtube', id: 'qT7lZfpEd64', title: '', client: '', category: '', vertical: false },
  { platform: 'youtube', id: 'PWaUzePOnIY', title: '', client: '', category: '', vertical: false },
  { platform: 'youtube', id: '-WlPA9pCn7k', title: '', client: '', category: '', vertical: false },
  { platform: 'youtube', id: 'C9KjyMWxz8w', title: '', client: '', category: '', vertical: false },
  { platform: 'youtube', id: 'Zq3VcdHesCE', title: '', client: '', category: '', vertical: false },
  { platform: 'youtube', id: 'rssBHWTTWaE', title: '', client: '', category: '', vertical: false },
  { platform: 'youtube', id: '0HlNG9TBt2U', title: '', client: '', category: '', vertical: false },
  { platform: 'youtube', id: '_Oc4lLhJH28', title: '', client: '', category: '', vertical: false },
  { platform: 'youtube', id: 'cDwbH1i1Qz8', title: '', client: '', category: '', vertical: false },
  { platform: 'youtube', id: 'CVF3xvwjqUA', title: '', client: '', category: '', vertical: false },
  { platform: 'vimeo', id: '1186309435', title: 'Yenuine redefine el cine', client: 'Yenuine', category: '', vertical: false },
  { platform: 'vimeo', id: '1163468176', title: '', client: '', category: '', vertical: true },
  { platform: 'vimeo', id: '1224153500', title: '', client: '', category: '', vertical: true },
  { platform: 'vimeo', id: '1099221225', title: '', client: '', category: '', vertical: true },
];
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0a0a0a;
    --panel: #121212;
    --raise: #1c1c1c;
    --white: #ede9e3;
    --muted: rgba(237,233,227,0.45);
    --border: rgba(237,233,227,0.09);
    --red: #E8001D;
    --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --display: 'Big Shoulders Display', 'Helvetica Neue', Arial, sans-serif;
    --side: 76px;
  }
  html, body { height: 100%; }
  body {
    background: var(--black); color: var(--white); font-family: var(--sans);
    overflow-x: hidden; -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; border-radius: 8px; }

  /* ---------- Sidebar ---------- */
  .side {
    position: fixed; inset: 0 auto 0 0; width: var(--side); z-index: 20;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: calc(22px + env(safe-area-inset-top, 0px)) 0 22px;
    background: var(--black); border-right: 1px solid var(--border);
  }
  .side-logo { margin-bottom: 26px; display: block; }
  .side-logo img { width: 34px; height: auto; display: block; }
  .side a, .side button.nav-btn {
    width: 52px; height: 52px; border-radius: 14px;
    display: grid; place-items: center; color: var(--muted);
    transition: color .2s, background .2s;
  }
  .side a:hover, .side button.nav-btn:hover { color: var(--white); background: var(--raise); }
  .side .active { color: var(--white); background: var(--raise); position: relative; }
  .side .active::before {
    content: ''; position: absolute; left: -12px; top: 14px; bottom: 14px;
    width: 3px; border-radius: 2px; background: var(--red);
  }
  .side svg { width: 22px; height: 22px; }
  .side .spacer { flex: 1; }

  /* ---------- Main ---------- */
  main { margin-left: var(--side); min-height: 100%; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 16px;
    padding: calc(18px + env(safe-area-inset-top, 0px)) 32px 14px;
    background: rgba(10,10,10,0.82);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .search {
    flex: 1; max-width: 560px; margin: 0 auto; position: relative;
  }
  .search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
  .search input {
    width: 100%; height: 46px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--panel); color: var(--white); font: inherit; font-size: 15px;
    padding: 0 16px 0 46px; outline: none; transition: border-color .2s;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus { border-color: rgba(232,0,29,0.6); }
  .cta {
    height: 46px; padding: 0 22px; border-radius: 12px; display: inline-flex; align-items: center;
    background: var(--raise); border: 1px solid var(--border); font-size: 14px; white-space: nowrap;
    transition: background .2s, border-color .2s;
  }
  .cta:hover { background: var(--red); border-color: var(--red); }

  .chips {
    display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none;
    padding: 4px 32px 18px;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: none; height: 36px; padding: 0 18px; border-radius: 10px;
    background: var(--raise); border: 1px solid var(--border); font-size: 14px; color: var(--muted);
    transition: color .2s, background .2s, border-color .2s;
  }
  .chip:hover { color: var(--white); }
  .chip[aria-pressed="true"] { background: var(--white); color: var(--black); border-color: var(--white); }

  .page-title {
    font-family: var(--display); font-weight: 900; text-transform: uppercase;
    font-size: clamp(64px, 11vw, 168px); line-height: .82; letter-spacing: -1px;
    padding: 18px 32px 28px; color: var(--white);
  }
  .page-title span { display: block; font-family: var(--sans); font-weight: 400; text-transform: none;
    font-size: 16px; letter-spacing: 0; line-height: 1.5; color: var(--muted); margin-top: 16px; max-width: 46ch; }

  .board {
    margin: 0 20px 40px; padding: 24px; border-radius: 20px;
    background: var(--panel); border: 1px solid var(--border);
  }
  .shelf + .shelf { margin-top: 40px; }
  .shelf h2 { font-size: 20px; font-weight: 500; margin: 0 4px 18px; }
  .grid { display: grid; gap: 28px 18px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .grid.vertical { grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }

  .card { display: block; text-align: left; width: 100%; }
  .media {
    position: relative; overflow: hidden; border-radius: 12px; background: #000;
    aspect-ratio: 16 / 9; isolation: isolate;
  }
  .vertical .media { aspect-ratio: 9 / 16; }
  .media img.thumb {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transition: opacity .6s ease;
  }
  .media.playing img.thumb { opacity: 0; }
  .media iframe {
    position: absolute; left: 0; width: 100%; border: 0; pointer-events: none; z-index: -1;
  }
  /* YouTube: el iframe es más alto que la caja para esconder título y logo */
  .media iframe.yt { top: -120px; height: calc(100% + 240px); }
  .media iframe.vm { top: 0; height: 100%; }
  .card:hover .media { outline: 1px solid rgba(232,0,29,0.7); outline-offset: 0; }

  .meta { display: flex; gap: 12px; margin-top: 12px; padding: 0 2px; }
  .avatar {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    display: grid; place-items: center; font-size: 13px; font-weight: 700;
    background: var(--raise); border: 1px solid var(--border);
  }
  .meta h3 { font-size: 15px; font-weight: 600; line-height: 1.3; }
  .meta p { font-size: 13px; color: var(--muted); margin-top: 3px; }

  .empty { padding: 60px 8px; color: var(--muted); font-size: 15px; }
  .empty button { color: var(--white); text-decoration: underline; text-underline-offset: 3px; }

  /* ---------- Reproductor ampliado ---------- */
  .viewer {
    position: fixed; inset: 0; z-index: 50; display: none; place-items: center;
    background: rgba(0,0,0,0.9); padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top, 0px));
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
  }
  .viewer.open { display: grid; }
  .viewer-frame { position: relative; width: min(1100px, 100%); aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000; }
  .viewer-frame.v { width: auto; height: min(86vh, 900px); aspect-ratio: 9 / 16; max-width: 100%; }
  .viewer-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .viewer-close {
    position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); right: 18px;
    width: 46px; height: 46px; border-radius: 50%; background: var(--raise); display: grid; place-items: center;
  }
  .viewer-close svg { width: 20px; height: 20px; }

  /* ---------- Móvil ---------- */
  @media (max-width: 760px) {
    :root { --side: 0px; }
    .side {
      inset: auto 0 0 0; width: 100%; height: calc(64px + env(safe-area-inset-bottom, 0px));
      flex-direction: row; justify-content: space-around; padding: 6px 12px env(safe-area-inset-bottom, 0px);
      border-right: 0; border-top: 1px solid var(--border);
    }
    .side-logo, .side .spacer { display: none; }
    .side .active::before { left: 14px; right: 14px; top: auto; bottom: -2px; width: auto; height: 3px; }
    main { padding-bottom: 80px; }
    .topbar { padding-left: 16px; padding-right: 16px; }
    .chips { padding-left: 16px; padding-right: 16px; }
    .page-title { padding-left: 16px; padding-right: 16px; }
    .board { margin: 0 0 40px; padding: 16px; border-radius: 0; border-left: 0; border-right: 0; }
    .grid.vertical { grid-template-columns: repeat(2, 1fr); gap: 20px 12px; }
    .cta { padding: 0 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .media img.thumb { transition: none; }
  }
</style>
</head>
<body>

<aside class="side" aria-label="Navegación">
  <a class="side-logo" href="index.html" aria-label="Yenuine, inicio">
    <img src="https://res.cloudinary.com/dqv3ntw1e/image/upload/f_auto,q_auto/v1777417614/negro_vbx1yu.png" alt="Yenuine">
  </a>
  <a href="index.html" title="Inicio" aria-label="Inicio">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>
  </a>
  <button class="nav-btn active" data-jump="top" title="Videos" aria-label="Todos los videos">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg>
  </button>
  <button class="nav-btn" data-jump="verticales" title="Verticales" aria-label="Videos verticales">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2"/><path d="m11 10 3 2-3 2z"/></svg>
  </button>
  <a href="https://wa.me/+584128681830" target="_blank" rel="noopener" title="Hablemos" aria-label="Escríbenos por WhatsApp">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M21 12a8.5 8.5 0 0 1-12.6 7.4L3 21l1.7-5.2A8.5 8.5 0 1 1 21 12z"/></svg>
  </a>
  <div class="spacer"></div>
</aside>

<main id="top">
  <header class="topbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar por artista, marca o proyecto" autocomplete="off" aria-label="Buscar videos">
    </label>
    <a class="cta" href="https://wa.me/+584128681830" target="_blank" rel="noopener">Hablemos</a>
  </header>

  <nav class="chips" id="chips" aria-label="Filtrar por categoría"></nav>

  <h1 class="page-title">Videos<span>Videoclips, spots y contenido para redes que hemos producido.</span></h1>

  <section class="board" id="board" aria-live="polite"></section>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Reproductor">
  <div class="viewer-frame" id="viewerFrame"></div>
  <button class="viewer-close" id="viewerClose" aria-label="Cerrar video">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
</div>

<script>
(function () {
  const board = document.getElementById('board');
  const chipsEl = document.getElementById('chips');
  const q = document.getElementById('q');
  let activeCat = 'Todos';

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const thumb = v => v.platform === 'youtube'
    ? `https://i.ytimg.com/vi/${v.id}/hqdefault.jpg`
    : `https://vumbnail.com/${v.id}.jpg`;

  // Autoplay silencioso, loop y sin controles (igual que la sección de cine del home)
  const bgSrc = v => v.platform === 'youtube'
    ? `https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&mute=1&controls=0&loop=1&playlist=${v.id}&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0`
    : `https://player.vimeo.com/video/${v.id}?background=1&autoplay=1&muted=1&loop=1&autopause=0&dnt=1`;

  // Al hacer clic: se abre en grande con sonido
  const fullSrc = v => v.platform === 'youtube'
    ? `https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0&modestbranding=1&playsinline=1`
    : `https://player.vimeo.com/video/${v.id}?autoplay=1&title=0&byline=0&portrait=0&dnt=1`;

  // ---------- Filtros ----------
  const cats = ['Todos', ...new Set(VIDEOS.map(v => v.category).filter(Boolean))];
  if (VIDEOS.some(v => v.vertical) && !cats.includes('Verticales')) cats.push('Verticales');
  chipsEl.innerHTML = cats.map(c => `<button class="chip" aria-pressed="${c === activeCat}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');
  chipsEl.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    activeCat = b.dataset.cat;
    chipsEl.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  });
  q.addEventListener('input', render);

  // ---------- Tarjetas ----------
  function card(v, i) {
    const initial = esc((v.client || 'Yenuine').trim().charAt(0).toUpperCase());
    return `<button class="card" data-i="${i}" aria-label="Ver ${esc(v.title || 'video')}">
      <div class="media" data-i="${i}">
        <img class="thumb" src="${thumb(v)}" alt="" loading="lazy" decoding="async">
      </div>
      <div class="meta">
        <div class="avatar" aria-hidden="true">${initial}</div>
        <div><h3 data-t="${i}">${esc(v.title || ' ')}</h3><p data-c="${i}">${esc(v.client || 'Yenuine')}</p></div>
      </div>
    </button>`;
  }

  function render() {
    stopAll();
    const term = q.value.trim().toLowerCase();
    const list = VIDEOS.map((v, i) => ({ v, i })).filter(({ v }) => {
      const catOk = activeCat === 'Todos' || (activeCat === 'Verticales' ? v.vertical : v.category === activeCat);
      const txtOk = !term || `${v.title} ${v.client} ${v.category}`.toLowerCase().includes(term);
      return catOk && txtOk;
    });
    const hor = list.filter(x => !x.v.vertical);
    const ver = list.filter(x => x.v.vertical);

    if (!list.length) {
      board.innerHTML = `<p class="empty">No hay videos que coincidan con “${esc(q.value)}”. <button id="clear">Ver todos</button></p>`;
      document.getElementById('clear').onclick = () => { q.value = ''; activeCat = 'Todos';
        chipsEl.querySelectorAll('.chip').forEach(x => x.setAttribute('aria-pressed', x.dataset.cat === 'Todos')); render(); };
      return;
    }
    board.innerHTML =
      (hor.length ? `<div class="shelf"><div class="grid">${hor.map(x => card(x.v, x.i)).join('')}</div></div>` : '') +
      (ver.length ? `<div class="shelf" id="verticales"><h2>Verticales</h2><div class="grid vertical">${ver.map(x => card(x.v, x.i)).join('')}</div></div>` : '');
    board.querySelectorAll('.media').forEach(m => io.observe(m));
  }

  // ---------- Autoplay solo en lo que está en pantalla ----------
  // Cargar decenas de iframes a la vez tumba la página; así solo reproducen los visibles.
  const io = new IntersectionObserver(entries => {
    entries.forEach(({ target: m, isIntersecting }) => isIntersecting ? start(m) : stop(m));
  }, { rootMargin: '150px 0px', threshold: 0.15 });

  function start(m) {
    if (m.querySelector('iframe')) return;
    const v = VIDEOS[m.dataset.i];
    const f = document.createElement('iframe');
    f.className = v.platform === 'youtube' ? 'yt' : 'vm';
    f.src = bgSrc(v);
    f.allow = 'autoplay; encrypted-media; picture-in-picture';
    f.tabIndex = -1; f.setAttribute('aria-hidden', 'true'); f.title = '';
    f.addEventListener('load', () => setTimeout(() => m.classList.add('playing'), 900));
    m.appendChild(f);
  }
  function stop(m) {
    const f = m.querySelector('iframe'); if (f) f.remove();
    m.classList.remove('playing');
  }
  function stopAll() { board.querySelectorAll('.media').forEach(m => { io.unobserve(m); stop(m); }); }

  // ---------- Reproductor ampliado ----------
  const viewer = document.getElementById('viewer');
  const frame = document.getElementById('viewerFrame');
  let lastFocus = null;
  board.addEventListener('click', e => {
    const c = e.target.closest('.card'); if (!c) return;
    const v = VIDEOS[c.dataset.i];
    lastFocus = c;
    frame.className = 'viewer-frame' + (v.vertical ? ' v' : '');
    frame.innerHTML = `<iframe src="${fullSrc(v)}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen title="${esc(v.title)}"></iframe>`;
    viewer.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('viewerClose').focus();
  });
  function closeViewer() {
    viewer.classList.remove('open'); frame.innerHTML = '';
    document.body.style.overflow = '';
    if (lastFocus) lastFocus.focus();
  }
  document.getElementById('viewerClose').onclick = closeViewer;
  viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && viewer.classList.contains('open')) closeViewer(); });

  // ---------- Sidebar ----------
  document.querySelectorAll('[data-jump]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.jump === 'verticales') {
      const chip = [...chipsEl.children].find(x => x.dataset.cat === 'Verticales');
      if (chip) chip.click();
    } else {
      const chip = chipsEl.querySelector('[data-cat="Todos"]'); if (chip) chip.click();
    }
    document.querySelectorAll('[data-jump]').forEach(x => x.classList.toggle('active', x === b));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }));

  // ---------- Títulos automáticos (para los videos sin título escrito) ----------
  function fillMeta(i) {
    const v = VIDEOS[i];
    const t = board.querySelector(`[data-t="${i}"]`), c = board.querySelector(`[data-c="${i}"]`);
    if (t) t.textContent = v.title || ' ';
    if (c) c.textContent = v.client || 'Yenuine';
    const card = t && t.closest('.card');
    if (card) {
      card.setAttribute('aria-label', 'Ver ' + (v.title || 'video'));
      card.querySelector('.avatar').textContent = (v.client || 'Yenuine').trim().charAt(0).toUpperCase();
    }
  }
  VIDEOS.forEach((v, i) => {
    if (v.title && v.client) return;
    const url = v.platform === 'youtube' ? `https://www.youtube.com/watch?v=${v.id}` : `https://vimeo.com/${v.id}`;
    const api = v.platform === 'vimeo'
      ? `https://vimeo.com/api/oembed.json?url=${encodeURIComponent(url)}`
      : `https://noembed.com/embed?url=${encodeURIComponent(url)}`;
    fetch(api).then(r => r.json()).then(d => {
      if (!v.title && d.title) v.title = d.title;
      if (!v.client && d.author_name) v.client = d.author_name;
      fillMeta(i);
    }).catch(() => {});
  });

  render();
})();
</script>
</body>
</html>
