   platform: 'youtube' o 'vimeo'
   id:       YouTube -> lo que va después de watch?v=   (ej. dQw4w9WgXcQ)
             Vimeo   -> el número de la URL             (ej. 1186309435)
   vertical: true para videos 9:16 (se mezclan con los horizontales)
   ===================================================================== */
const VIDEOS = [
  { platform: 'youtube', id: 'O3RkS5pepDk' },
  { platform: 'youtube', id: 'aQU6wWtliG4' },
  { platform: 'youtube', id: 'ZNazTNiISpg' },

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --black: #0a0a0a;
    --panel: #121212;
    --raise: #1c1c1c;
    --white: #ede9e3;
    --muted: rgba(237,233,227,0.45);
    --border: rgba(237,233,227,0.09);
    --red: #E8001D;
    --sans: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --display: 'Big Shoulders Display', 'Helvetica Neue', Arial, sans-serif;
    --side: 76px;
  }
  html, body { height: 100%; }
  body {
    background: var(--black); color: var(--white); font-family: var(--sans);
    overflow-x: hidden; -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; border-radius: 8px; }

  /* ---------- Sidebar ---------- */
  .side {
    position: fixed; inset: 0 auto 0 0; width: var(--side); z-index: 20;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: calc(22px + env(safe-area-inset-top, 0px)) 0 22px;
    background: var(--black); border-right: 1px solid var(--border);
  }
  .side-logo { margin-bottom: 26px; display: block; }
  .side-logo img { width: 34px; height: auto; display: block; }
  .side a, .side button.nav-btn {
    width: 52px; height: 52px; border-radius: 14px;
    display: grid; place-items: center; color: var(--muted);
    transition: color .2s, background .2s;
  }
  .side a:hover, .side button.nav-btn:hover { color: var(--white); background: var(--raise); }
  .side .active { color: var(--white); background: var(--raise); position: relative; }
  .side .active::before {
    content: ''; position: absolute; left: -12px; top: 14px; bottom: 14px;
    width: 3px; border-radius: 2px; background: var(--red);
  }
  .side svg { width: 22px; height: 22px; }

  /* ---------- Main ---------- */
  main { margin-left: var(--side); min-height: 100%; }
  .topbar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: calc(18px + env(safe-area-inset-top, 0px)) 32px 14px;
    background: rgba(10,10,10,0.82);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .chips { display: flex; gap: 10px; }
  .chip {
    height: 36px; padding: 0 18px; border-radius: 10px;
    background: var(--raise); border: 1px solid var(--border); font-size: 14px; color: var(--muted);
    transition: color .2s, background .2s, border-color .2s;
  }
  .chip:hover { color: var(--white); }
  .chip[aria-pressed="true"] { background: var(--white); color: var(--black); border-color: var(--white); }
  .cta {
    height: 46px; padding: 0 22px; border-radius: 12px; display: inline-flex; align-items: center;
    background: var(--raise); border: 1px solid var(--border); font-size: 14px; white-space: nowrap;
    transition: background .2s, border-color .2s;
  }
  .cta:hover { background: var(--red); border-color: var(--red); }

  .page-title {
    font-family: var(--display); font-weight: 900; text-transform: uppercase;
    font-size: clamp(64px, 11vw, 168px); line-height: .82; letter-spacing: -1px;
    padding: 18px 32px 28px; color: var(--white);
  }
  .page-title span { display: block; font-family: var(--sans); font-weight: 400; text-transform: none;
    font-size: 16px; letter-spacing: 0; line-height: 1.5; color: var(--muted); margin-top: 16px; max-width: 46ch; }

  .board {
    margin: 0 20px 40px; padding: 18px; border-radius: 20px;
    background: var(--panel); border: 1px solid var(--border);
  }
  /* Mosaico: horizontales y verticales mezclados */
  .wall { columns: 4 240px; column-gap: 14px; }
  .media {
    position: relative; overflow: hidden; border-radius: 12px; background: #000;
    aspect-ratio: 16 / 9; isolation: isolate;
    break-inside: avoid; margin-bottom: 14px;
  }
  .media.v { aspect-ratio: 9 / 16; }
  .media img.thumb {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    transition: opacity .6s ease;
  }
  .media.playing img.thumb { opacity: 0; }
  .media iframe {
    position: absolute; left: 0; width: 100%; border: 0; pointer-events: none; z-index: -1;
  }
  /* YouTube: el iframe es más alto que la caja para que título, logo y botones queden fuera del recorte */
  .media iframe.yt { top: -160px; height: calc(100% + 320px); }
  .media iframe.vm { top: 0; height: 100%; }
  /* Capa que tapa el video para que no se pueda tocar ni aparezca ningún control */
  .media::after { content: ''; position: absolute; inset: 0; z-index: 1; }

  /* ---------- Móvil ---------- */
  @media (max-width: 760px) {
    :root { --side: 0px; }
    .side {
      inset: auto 0 0 0; width: 100%; height: calc(64px + env(safe-area-inset-bottom, 0px));
      flex-direction: row; justify-content: space-around; padding: 6px 12px env(safe-area-inset-bottom, 0px);
      border-right: 0; border-top: 1px solid var(--border);
    }
    .side-logo { display: none; }
    .side .active::before { left: 14px; right: 14px; top: auto; bottom: -2px; width: auto; height: 3px; }
    main { padding-bottom: 80px; }
    .topbar { padding-left: 16px; padding-right: 16px; }
    .page-title { padding-left: 16px; padding-right: 16px; }
    .board { margin: 0 0 40px; padding: 10px; border-radius: 0; border-left: 0; border-right: 0; }
    .wall { columns: 2; column-gap: 10px; }
    .media { margin-bottom: 10px; border-radius: 10px; }
    .cta { padding: 0 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .media img.thumb { transition: none; }
  }
</style>

<body>

<main id="top">
  <header class="topbar">

<script>
(function () {
  const wall = document.getElementById('wall');
  let filter = 'all';

  const thumb = v => v.platform === 'youtube'
    ? 'https://i.ytimg.com/vi/' + v.id + '/hqdefault.jpg'
    : 'https://vumbnail.com/' + v.id + '.jpg';

  // Autoplay silencioso, en loop y sin controles (igual que la sección de cine del home)
  const src = v => v.platform === 'youtube'
    ? 'https://www.youtube-nocookie.com/embed/' + v.id + '?autoplay=1&mute=1&controls=0&loop=1&playlist=' + v.id + '&playsinline=1&rel=0&modestbranding=1&iv_load_policy=3&disablekb=1&fs=0&cc_load_policy=0'
    : 'https://player.vimeo.com/video/' + v.id + '?background=1&autoplay=1&muted=1&loop=1&autopause=0&dnt=1';

  // Solo reproducen los videos que están en pantalla; así la página no se traba
  const io = new IntersectionObserver(entries => {
    entries.forEach(({ target: m, isIntersecting }) => isIntersecting ? start(m) : stop(m));
  }, { rootMargin: '150px 0px', threshold: 0.1 });

  function start(m) {
    if (m.querySelector('iframe')) return;
    const v = VIDEOS[m.dataset.i];
    const f = document.createElement('iframe');
    f.className = v.platform === 'youtube' ? 'yt' : 'vm';
    f.src = src(v);
    f.allow = 'autoplay; encrypted-media; picture-in-picture';
    f.tabIndex = -1; f.setAttribute('aria-hidden', 'true'); f.title = 'Video';
    f.addEventListener('load', () => setTimeout(() => m.classList.add('playing'), 1200));
    m.appendChild(f);
  }
  function stop(m) {
    const f = m.querySelector('iframe'); if (f) f.remove();
    m.classList.remove('playing');
  }

  function render() {
    wall.querySelectorAll('.media').forEach(m => { io.unobserve(m); stop(m); });
    wall.innerHTML = VIDEOS.map((v, i) => (filter === 'v' && !v.vertical) ? '' :
      '<div class="media' + (v.vertical ? ' v' : '') + '" data-i="' + i + '">' +
        '<img class="thumb" src="' + thumb(v) + '" alt="" loading="lazy" decoding="async">' +
      '</div>').join('');
    wall.querySelectorAll('.media').forEach(m => io.observe(m));
  }

  document.querySelectorAll('[data-filter]').forEach(b => b.addEventListener('click', () => {
    filter = b.dataset.filter;
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.filter === filter));
    document.querySelectorAll('.nav-btn[data-filter]').forEach(n => n.classList.toggle('active', n.dataset.filter === filter));
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }));

  render();
})();
</script>
